<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="Study With Deepak Student Login">

<title>Student Login - Study With Deepak</title>

<link rel="icon"
      type="image/png"
      href="logo.png">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;

  background:
    linear-gradient(
      135deg,
      #102e5d,
      #173b72,
      #2868b2
    );

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.login-wrapper {
  width: 100%;
  max-width: 440px;
}

.logo {
  text-align: center;
  color: white;
  margin-bottom: 20px;
}

.logo img {
  width: 70px;
  height: 70px;
  object-fit: contain;
  border-radius: 18px;
  margin-bottom: 10px;
}

.logo h1 {
  font-size: 26px;
  margin-bottom: 6px;
}

.logo p {
  font-size: 14px;
  opacity: 0.85;
}

.login-card {
  background: white;
  border-radius: 22px;
  padding: 32px 26px;

  box-shadow:
    0 20px 50px rgba(0,0,0,0.22);

  animation: appear 0.6s ease;
}

@keyframes appear {

  from {
    opacity: 0;
    transform: translateY(25px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

.login-title {
  text-align: center;
  color: #173b72;
  margin-bottom: 8px;
  font-size: 25px;
}

.login-subtitle {
  text-align: center;
  color: #687386;
  font-size: 14px;
  margin-bottom: 25px;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  color: #173b72;
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 7px;
}

.form-group input {
  width: 100%;
  padding: 13px 14px;

  border: 1px solid #d8e0ec;
  border-radius: 10px;

  font-size: 15px;
  outline: none;

  transition:
    border-color 0.25s ease,
    box-shadow 0.25s ease;
}

.form-group input:focus {
  border-color: #2868b2;

  box-shadow:
    0 0 0 3px rgba(40,104,178,0.12);
}

.password-box {
  position: relative;
}

.password-box input {
  padding-right: 80px;
}

.show-password {
  position: absolute;

  right: 10px;
  top: 50%;

  transform: translateY(-50%);

  border: none;
  background: transparent;

  color: #2868b2;

  font-weight: 700;
  font-size: 12px;

  cursor: pointer;
}

.login-button {
  width: 100%;

  border: none;
  border-radius: 10px;

  padding: 14px;

  background: #173b72;
  color: white;

  font-size: 16px;
  font-weight: 800;

  cursor: pointer;

  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease,
    background 0.25s ease;
}

.login-button:hover {
  background: #2868b2;

  transform: translateY(-2px);

  box-shadow:
    0 8px 20px rgba(23,59,114,0.25);
}

.login-button:disabled {
  opacity: 0.65;
  cursor: not-allowed;
  transform: none;
}

.status {
  display: none;

  margin-top: 18px;

  padding: 12px 14px;

  border-radius: 9px;

  font-size: 14px;

  line-height: 1.5;

  text-align: center;
}

.status.error {
  display: block;

  background: #fff0f0;
  color: #b42318;

  border: 1px solid #f3c2c2;
}

.status.success {
  display: block;

  background: #eefbf2;
  color: #18753c;

  border: 1px solid #bfe5c9;
}

.register {
  text-align: center;

  margin-top: 22px;

  color: #687386;

  font-size: 14px;
}

.register a {
  color: #173b72;

  font-weight: 800;

  text-decoration: none;
}

.register a:hover {
  text-decoration: underline;
}

.back-home {
  display: block;

  text-align: center;

  margin-top: 18px;

  color: white;

  text-decoration: none;

  font-size: 14px;

  opacity: 0.9;
}

.back-home:hover {
  opacity: 1;
}

.course-message {
  display: none;

  margin-bottom: 20px;

  padding: 12px;

  background: #edf3fb;

  border-radius: 10px;

  color: #173b72;

  text-align: center;

  font-size: 13px;

  line-height: 1.5;
}

@media (max-width: 480px) {

  body {
    padding: 15px;
  }

  .login-card {
    padding: 27px 20px;
  }

  .logo h1 {
    font-size: 23px;
  }

}

</style>

</head>

<body>

<div class="login-wrapper">

  <div class="logo">

    <img
      src="logo.png"
      alt="Study With Deepak Logo">

    <h1>
      Study With Deepak
    </h1>

    <p>
      Learn • Practice • Succeed
    </p>

  </div>


  <div class="login-card">

    <h2 class="login-title">
      🎓 Student Login
    </h2>

    <p class="login-subtitle">
      Login to access your learning dashboard
    </p>


    <div
      class="course-message"
      id="courseMessage">
    </div>


    <form id="loginForm">

      <div class="form-group">

        <label for="identifier">
          Username or Email
        </label>

        <input
          type="text"
          id="identifier"
          name="identifier"
          placeholder="Enter username or email"
          autocomplete="username"
          required>

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()">

            SHOW

          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-button"
        id="loginButton">

        🔐 Login

      </button>

    </form>


    <div
      id="status"
      class="status">
    </div>


    <div class="register">

      Don't have an account?

      <a href="signup.html">
        Create Student Account
      </a>

    </div>

  </div>


  <a
    href="index.html"
    class="back-home">

    ← Back to Home

  </a>

</div>


<script>

/* ============================================================
   API
============================================================ */

const API_URL =
  "https://study-with-deepak-api.deepakmahatobist.workers.dev";


/* ============================================================
   COURSE FROM URL
============================================================ */

const params =
  new URLSearchParams(
    window.location.search
  );

const selectedCourse =
  params.get("course");


const courseNames = {

  "upper-primary":
    "Upper Primary",

  "wbssc-ix-x":
    "WBSSC IX–X",

  "wbssc-xi-xii":
    "WBSSC XI–XII",

  "ssc-psc":
    "SSC–PSC",

  "net-set":
    "NET/SET"

};


if (
  selectedCourse &&
  courseNames[selectedCourse]
) {

  const message =
    document.getElementById(
      "courseMessage"
    );

  message.style.display = "block";

  message.innerHTML =
    "📚 You selected <strong>" +
    courseNames[selectedCourse] +
    "</strong>.<br>" +
    "Login to continue.";

}


/* ============================================================
   PASSWORD
============================================================ */

function togglePassword() {

  const password =
    document.getElementById(
      "password"
    );

  const button =
    document.querySelector(
      ".show-password"
    );

  if (
    password.type === "password"
  ) {

    password.type = "text";

    button.textContent = "HIDE";

  } else {

    password.type = "password";

    button.textContent = "SHOW";

  }

}


/* ============================================================
   STATUS
============================================================ */

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );

  status.className =
    "status " + type;

  status.textContent =
    message;

}


/* ============================================================
   LOGIN
============================================================ */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const identifier =
        document
          .getElementById("identifier")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      const button =
        document.getElementById(
          "loginButton"
        );


      if (
        !identifier ||
        !password
      ) {

        showStatus(
          "Please enter your username/email and password.",
          "error"
        );

        return;

      }


      button.disabled = true;

      button.textContent =
        "⏳ Logging in...";


      showStatus(
        "Connecting to Study With Deepak...",
        "success"
      );


      try {

        const response =
          await fetch(
            API_URL + "/api/login",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                username:
                  identifier,

                password:
                  password

              })

            }
          );


        let result;

        try {

          result =
            await response.json();

        } catch {

          throw new Error(
            "The server returned an invalid response."
          );

        }


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.error ||
            "Login failed."
          );

        }


        /*
         * SAVE LOGIN INFORMATION
         */

        localStorage.setItem(
          "studyWithDeepakToken",
          result.token
        );


        localStorage.setItem(
          "studyWithDeepakUser",
          JSON.stringify(
            result.user
          )
        );


        if (selectedCourse) {

          localStorage.setItem(
            "studyWithDeepakSelectedCourse",
            selectedCourse
          );

        }


        showStatus(
          "Login successful! Opening your student dashboard...",
          "success"
        );


        /*
         * REDIRECT
         */

        setTimeout(
          function() {

            window.location.href =
              "student-dashboard.html";

          },
          800
        );


      } catch (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );


        showStatus(
          error.message ||
          "Unable to connect to the server.",
          "error"
        );


        button.disabled = false;

        button.textContent =
          "🔐 Login";

      }

    }
  );

</script>

</body>
</html>
